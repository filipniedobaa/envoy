syntax = "proto3";

package envoy.extensions.filters.http.my_cache.v3;

import "google/protobuf/wrappers.proto";

import "udpa/annotations/status.proto";
import "validate/validate.proto";

option java_package = "io.envoyproxy.envoy.extensions.filters.http.my_cache.v3";
option java_outer_classname = "MyCacheProto";
option java_multiple_files = true;
option go_package = "github.com/envoyproxy/go-control-plane/envoy/extensions/filters/http/my_cache/v3;my_cachev3";
option (udpa.annotations.file_status).package_version_status = ACTIVE;

// [#protodoc-title: My cache]
// In-memory HTTP cache with request coalescing.
// [#extension: envoy.filters.http.my_cache]

message MyCache {
  // Total memory budget for stored responses, in bytes. Least recently used
  // entries are evicted when it is exceeded. Defaults to 256 MiB.
  google.protobuf.UInt64Value max_total_bytes = 1 [(validate.rules).uint64 = {gt: 0}];

  // Largest single response that is stored, in bytes. Larger responses are still
  // coalesced and streamed, but not stored. Also bounds how far a slow client may
  // fall behind in push mode. Defaults to 32 MiB.
  google.protobuf.UInt64Value max_object_bytes = 2 [(validate.rules).uint64 = {gt: 0}];
}

// Per-route configuration is not supported yet. The message exists because the
// filter factory base class requires a per-route type.
message MyCachePerRoute {
}